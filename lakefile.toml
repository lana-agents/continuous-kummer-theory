name = "continuous-kummer-theory"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ContinuousKummerTheory"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[require]]
name = "pi1"
git = "https://github.com/lana-agents/pi1"
rev = "8e0239afa0206c22a210d0fa9a982c574826f879"

[[lean_lib]]
name = "ContinuousKummerTheory"
