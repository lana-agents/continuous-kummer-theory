status:
  scope: >-
    All targets formalised without sorry: continuous Hilbert 90 for arbitrary Galois extensions;
    the Kummer isomorphism Kˣ/(Kˣ)ⁿ ≃ H¹_cont(Gal(Ω/K), μ_n); restriction, and corestriction = norm
    for finite subextensions (cor independent of coset representatives; cor ∘ res = [L:K]); the
    inverse-limit form H¹_cont(G_K, Ẑ(1)) ≃ lim Kˣ/(Kˣ)ⁿ, a homeomorphism for the natural
    topologies, identified with Mathlib's profinite completion of Kˣ when char K = 0 and all
    Kˣ/(Kˣ)ⁿ are finite; finiteness of Kˣ/(Kˣ)ⁿ for fraction fields of complete DVRs with finite
    residue field of characteristic-zero fraction field, hence for Mathlib's
    IsNonarchimedeanLocalField of characteristic zero and for ℚ_p; ContH1 ≅ Mathlib's
    continuousCohomology 1 (as groups; k-linear homeomorphism onto Z¹/B¹); Kummer classes of
    values of functions, and the comparison ι^* κ_F(f) = π^* κ_K(f(x)) along decomposition groups
    (and along sections s_x of π); inflation in degree one; Kummer-faithfulness for G_m of
    function fields of curves (AbsTopIII Rem. 1.5.4(ii) for G_m) and injectivity of the Kummer
    map of an affine curve U over a G_m-Kummer-faithful field, in pi1's Galois model of π₁(U)
    (AbsTopIII Prop. 1.6(i)).
