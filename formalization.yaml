version: "v0.4"

project:
  name: "continuous-kummer-theory"
  description: >-
    Lean 4 / Mathlib formalization of continuous Kummer theory for a field K with a chosen
    separable (or Galois) closure Ω: continuous H¹ as continuous crossed homomorphisms modulo
    principal ones, Hilbert 90 for infinite Galois extensions, the natural isomorphism
    Kˣ/(Kˣ)ⁿ ≃ H¹_cont(Gal(Ω/K), μ_n), its inverse-limit form H¹_cont(G_K, Ẑ(1)) ≃ lim Kˣ/(Kˣ)ⁿ
    (the profinite completion of Kˣ when char K = 0 and all Kˣ/(Kˣ)ⁿ are finite), compatibility
    with restriction and with corestriction/norm, and Kummer classes of values of functions at
    points with their basic naturality.
  authors:
    - "Claude (Anthropic)"
    - "LANA Project"
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"

sources:
  - title: "Galois Cohomology"
    authors: ["Jean-Pierre Serre"]
    type: "book"
    note: "H¹ of profinite groups via continuous cocycles (Chapter I); Kummer theory."
  - title: "Cohomology of Number Fields"
    authors: ["Jürgen Neukirch", "Alexander Schmidt", "Kay Wingberg"]
    type: "book"
    note: "Restriction and corestriction (Chapter I); Kummer theory and Ẑ(1)."
  - title: "Étale Cohomology"
    authors: ["James S. Milne"]
    type: "book"
    note: "General reference for Kummer theory; not followed in detail."

related_formalizations:
  - id: "https://github.com/lana-agents/local-class-field-theory"
    relationship: "other"
    note: "Planned consumer; does not require this repository."
  - id: "https://github.com/lana-agents/tate-curves-theta"
    relationship: "other"
    note: "Lists this repository as a future dependency; does not require it."

classification:
  arxiv: ["math.NT"]
  msc2020: ["11S25", "12G05"]

status:
  scope: >-
    Core targets formalised without sorry: continuous Hilbert 90 for arbitrary Galois extensions;
    the Kummer isomorphism Kˣ/(Kˣ)ⁿ ≃ H¹_cont(Gal(Ω/K), μ_n) for Galois Ω/K containing n-th roots
    (in particular separable closures with n invertible); restriction for arbitrary L/K and
    corestriction = norm for finite subextensions (with cor ∘ res = [L:K]); the inverse-limit form
    H¹_cont(G_K, Ẑ(1)) ≃ lim H¹_cont(G_K, μ_n) ≃ lim Kˣ/(Kˣ)ⁿ for every field K (n invertible in K),
    identified with Mathlib's profinite completion of Kˣ when char K = 0 and all Kˣ/(Kˣ)ⁿ are finite
    (assumed as a hypothesis, not proved for p-adic fields); Kummer classes of values f(x) of
    functions at points with naturality under restriction and corestriction. Not formalised: the
    comparison of the class of f(x) with the class of f via the section attached to a rational point,
    and a comparison of ContH1 with Mathlib's ContinuousCohomology in degree 1.
