fidelity:
  divergences: >-
    H¹_cont is modelled as continuous crossed homomorphisms modulo principal ones (ContH1), not via
    Mathlib's homogeneous-cochain ContinuousCohomology; the two are not compared. Cohomology groups
    carry no topology. μ_n is the discrete type KummerTheory.Mu n Ω. Ẑ(1) and the completion
    (Kˣ)^∧ are inverse limits over the n invertible in K ordered by divisibility (in characteristic
    p > 0 this is the prime-to-p part). Corestriction is defined by the cochain formula for one fixed
    choice of coset representatives; independence of the choice is not proved. The finiteness of
    Kˣ/(Kˣ)ⁿ for p-adic fields is a hypothesis (FiniteKummerQuotients), not proved. Points of
    "functions" are modelled as K-algebra maps R →ₐ[K] L out of a K-algebra R.

review:
