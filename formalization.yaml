    Claude was the coding agent.

fidelity:
  divergences: >-
    H¹_cont is modelled as continuous crossed homomorphisms modulo principal ones (ContH1); it is
    identified with Mathlib's homogeneous-cochain continuousCohomology in degree 1 only as an
    additive group isomorphism (ContH1 has no k-module structure). μ_n is the discrete type
    KummerTheory.Mu n Ω. Ẑ(1) and (Kˣ)^∧ are inverse limits over the n invertible in K ordered by
    divisibility (prime-to-p part in characteristic p > 0). The discrete topology on Kˣ/(Kˣ)ⁿ is
    a scoped instance. "Finite extension of ℚ_p" is expressed via Mathlib's
    IsNonarchimedeanLocalField (or a complete DVR with finite residue field); Mathlib does not
    itself equip a bare finite-dimensional ℚ_p-algebra with that structure. Points of functions
    are K-algebra maps R →ₐ[K] L; the function-vs-value comparison is formulated with
    decomposition groups / sections of π : D → G_K, not with étale fundamental groups of schemes.
    Kummer theory for curves: Π_U is pi1's Galois model H ⧸ ⟨⟨inertia⟩⟩ (identified by pi1 with
    the étale π₁ of [Spec R / A]); coefficients are the arithmetic Ẑ(1) = lim μ_n(Ω), not the
    group-theoretic cyclotome M_X of AbsTopIII Prop. 1.4(ii); Kummer-faithfulness is only the
    G_m-part over k itself (Def. 1.5(a) for A = G_m, k_H = k).

review:
  status: "agent-reviewed"
  reviewers: ["Claude (Anthropic)"]
  notes: >-
    The formalization has only been reviewed by Claude; it has not been reviewed by a human.
