version: "v0.4"

project:
  name: "continuous-kummer-theory"
  description: >-
    Lean 4 / Mathlib formalization of continuous Kummer theory for a field K with a chosen
    separable (or Galois) closure Ω: continuous H¹ as continuous crossed homomorphisms modulo
    principal ones, Hilbert 90 for infinite Galois extensions, the natural isomorphism
    Kˣ/(Kˣ)ⁿ ≃ H¹_cont(Gal(Ω/K), μ_n), its inverse-limit form H¹_cont(G_K, Ẑ(1)) ≃ lim Kˣ/(Kˣ)ⁿ
    (the profinite completion of Kˣ, as topological groups, when char K = 0 and all Kˣ/(Kˣ)ⁿ are
    finite, which is proved for p-adic fields), compatibility with restriction and with
    corestriction/norm, comparison with Mathlib's continuousCohomology in degree 1, Kummer
    classes of functions versus Kummer classes of their values via decomposition groups, and
    Kummer theory for affine curves (Mochizuki, AbsTopIII Prop. 1.6(i)): the Kummer map
    Γ(U, O^×) → H¹(Π_U, Ẑ(1)) is injective over fields that are Kummer-faithful for G_m.
  authors:
    - "Claude (Anthropic)"
    - "LANA Project"
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"

sources:
  - title: "Galois Cohomology"
    authors: ["Jean-Pierre Serre"]
    type: "book"
    note: "H¹ of profinite groups via continuous cocycles (Chapter I); Kummer theory."
  - title: "Cohomology of Number Fields"
    authors: ["Jürgen Neukirch", "Alexander Schmidt", "Kay Wingberg"]
    type: "book"
    note: "Restriction and corestriction (Chapter I); Kummer theory and Ẑ(1)."
  - title: "Étale Cohomology"
    authors: ["James S. Milne"]
    type: "book"
    note: "General reference for Kummer theory; not followed in detail."

  - title: "Topics in Absolute Anabelian Geometry III: Global Reconstruction Algorithms"
    authors: ["Shinichi Mochizuki"]
    type: "article"
    note: "§1: Definition 1.5 (Kummer-faithful), Remark 1.5.4(ii), Proposition 1.6(i)."

